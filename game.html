<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Love Memory Match 💕</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Love Memory Match 💖</h1>
      <p>Find all the matching pairs to reveal the special message! 😊</p>
      <div id="game-board"></div>
      <button class="btn" onclick="restartGame()">Restart Game 🔄</button>
    </div>

    <script>
      const cardsArray = [
        "❤️",
        "❤️",
        "💋",
        "💋",
        "💕",
        "💕",
        "😍",
        "😍",
        "💖",
        "💖",
        "🌹",
        "🌹",
      ];

      let shuffledCards = [];
      let flippedCards = [];
      let matchedPairs = 0;

      function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
      }

      function createBoard() {
        shuffledCards = shuffle([...cardsArray]);
        const board = document.getElementById("game-board");
        board.innerHTML = "";
        shuffledCards.forEach((symbol, index) => {
          const card = document.createElement("div");
          card.classList.add("card");
          card.dataset.index = index;
          card.dataset.symbol = symbol;
          card.innerHTML = "<span class='card-content'>" + symbol + "</span>";
          card.addEventListener("click", flipCard);
          board.appendChild(card);
        });
      }

      function flipCard() {
        if (flippedCards.length < 2 && !this.classList.contains("matched")) {
          this.classList.add("flipped");
          flippedCards.push(this);
          if (flippedCards.length === 2) {
            setTimeout(checkMatch, 800);
          }
        }
      }

      function checkMatch() {
        if (flippedCards[0].dataset.symbol === flippedCards[1].dataset.symbol) {
          flippedCards.forEach((card) => card.classList.add("matched"));
          matchedPairs++;
          if (matchedPairs === cardsArray.length / 2) {
            setTimeout(showWinMessage, 500);
          }
        } else {
          flippedCards.forEach((card) => card.classList.remove("flipped"));
        }
        flippedCards = [];
      }

      function showWinMessage() {
        window.location.href = "love-letter.html"; // Redirect to the love letter page
      }

      function restartGame() {
        matchedPairs = 0;
        flippedCards = [];
        createBoard();
      }

      createBoard();
    </script>
  </body>
</html>
